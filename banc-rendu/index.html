<!doctype html>
<meta charset="utf-8">
<title>Banc d'essai — porte de rendu</title>
<style>
  :root { --nuit:#070B1A; --nuit2:#0C1228; --encre:#EDF3FF; --faible:#8FA3CE;
          --miami:#3DE0FF; --alerte:#FF5C5C; --mieux:#2BE88A; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--nuit); color:var(--encre); font:14px/1.4 ui-monospace,Menlo,monospace; padding:20px }
  h1 { font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--miami); font-weight:600 }
  .sous { color:var(--faible); margin:6px 0 18px; font-size:12px }
  .rangee { display:grid; grid-template-columns:300px 300px 1fr; gap:14px; align-items:start;
            padding:14px 0; border-top:1px solid rgba(120,150,255,.18) }
  .vign { width:300px; height:300px; background:var(--nuit2); display:grid; place-items:center; overflow:hidden }
  .vign img, .vign canvas { max-width:100%; max-height:100%; display:block }
  .vign canvas { image-rendering:pixelated }
  #depot { margin-bottom:16px; color:var(--faible); font-size:12px }
  .etiq { color:var(--faible); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px }
  .fiche b { color:var(--encre) } .fiche div { margin:3px 0; color:var(--faible); font-size:12px }
  .pal { display:flex; margin-top:10px; height:22px; width:100%; max-width:340px }
  .pal i { flex:1 } .ok { color:var(--mieux) } .ko { color:var(--alerte) }
  #verdict { margin:22px 0 0; padding:14px; border:1px solid rgba(120,150,255,.18); font-size:12px; color:var(--faible) }
</style>
<h1>Banc d'essai — porte de rendu</h1>
<p class="sous">Réglages globaux et figés · aucun ajustement par photo · <span id="reg"></span></p>
<input type="file" id="depot" multiple accept="image/*">
<div id="grille"></div>
<div id="verdict"></div>

<script type="module">
import { pipeline, REGLAGES } from './pipeline.js'
// Chrome headless avance en TEMPS VIRTUEL : performance.now() saute jusqu'au budget.
// Un chrono mesuré là-dedans ne mesure rien. On l'étiquette plutôt que de le laisser mentir —
// le verdict de performance se rend en navigateur réel, sur appareil réel.
const virtuel = new URLSearchParams(location.search).has('headless')
document.getElementById('reg').textContent = JSON.stringify(REGLAGES)
const grille = document.getElementById('grille')
const resultats = []

async function traiter(nom, blob) {
  const rangee = document.createElement('div')
  rangee.className = 'rangee'
  try {
    const r = await pipeline(blob)
    const src = document.createElement('canvas')
    src.width = r.source.width; src.height = r.source.height
    src.getContext('2d').drawImage(r.source, 0, 0)
    rangee.innerHTML = `
      <div><div class="etiq">source réduite</div><div class="vign"></div></div>
      <div><div class="etiq">rendu pixel</div><div class="vign"></div></div>
      <div class="fiche">
        <div><b>${nom}</b></div>
        <div>grille ${r.gw}×${r.gh} · bloc ${REGLAGES.bloc} px</div>
        <div>teinte dominante ${r.teintes.dominante}° · secondaire ${r.teintes.secondaire}°
             · force ${r.teintes.force.toFixed(2)}</div>
        <div class="${virtuel ? '' : r.ms < 1000 ? 'ok' : 'ko'}">${virtuel
          ? 'chrono non mesurable — temps virtuel headless'
          : `réduction + rendu en ${r.ms.toFixed(1)} ms ${r.ms < 1000
              ? '(sous la cible de 1 s)' : '(AU-DESSUS de la cible de 1 s)'}`}</div>
        <div class="pal">${r.palette.map(c => `<i style="background:rgb(${c})"></i>`).join('')}</div>
      </div>`
    rangee.querySelectorAll('.vign')[0].append(src)
    // Le rendu est une grille de ~85×90 : affiché à sa taille native, on jugerait un
    // timbre-poste. On l'agrandit au plus proche voisin pour juger le pixel tel qu'il est.
    const vue = document.createElement('canvas')
    vue.width = r.gw; vue.height = r.gh
    vue.getContext('2d').drawImage(r.canvas, 0, 0)
    const k = Math.min(300 / r.gw, 300 / r.gh)
    vue.style.width = Math.round(r.gw * k) + 'px'
    vue.style.height = Math.round(r.gh * k) + 'px'
    rangee.querySelectorAll('.vign')[1].append(vue)
    resultats.push({ nom, ms: r.ms, teinte: r.teintes.dominante, force: r.teintes.force })
  } catch (e) {
    rangee.innerHTML = `<div class="fiche ko">${nom} — ÉCHEC : ${e.message}</div>`
    resultats.push({ nom, echec: e.message })
  }
  grille.append(rangee)
}

const manifeste = await fetch('./photos/manifest.json').then(r => r.json()).catch(() => [])
for (const nom of manifeste) {
  const blob = await fetch('./photos/' + encodeURIComponent(nom)).then(r => r.blob()).catch(() => null)
  if (blob) await traiter(nom, blob); else await traiter(nom, new Blob())
}

const v = document.getElementById('verdict')
if (!manifeste.length) {
  v.innerHTML = `<b class="ko">Jeu d'essai vide.</b> Déposer les photos dans
    <code>banc-rendu/photos/</code> puis relancer <code>./banc-rendu/lancer.sh</code>.
    Le jeu doit contenir au minimum trois motos distinctes dont une qui n'est pas la tienne,
    un fond de paddock chargé, un contre-jour, un profil et un trois-quarts avant.`
} else {
  const echecs = resultats.filter(r => r.echec)
  const lents = resultats.filter(r => !r.echec && r.ms >= 1000)
  v.innerHTML = `<b>${resultats.length} photo(s) · réglages identiques pour toutes.</b><br>
    ${echecs.length ? `<span class="ko">${echecs.length} échec(s) de pipeline.</span>`
                    : `<span class="ok">Aucun échec de pipeline.</span>`}
    ${virtuel
      ? `<span class="ko">Chrono non rendu : temps virtuel headless.</span>
         Ouvrir <code>banc-rendu/index.html</code> dans un vrai navigateur pour la mesure,
         et sur l'iPhone pour le verdict qui compte.`
      : lents.length ? `<span class="ko">${lents.length} au-dessus de 1 s.</span>`
                     : `<span class="ok">Toutes sous 1 s.</span>`}<br>
    <b>Critères à juger à l'œil, énoncés avant de regarder :</b>
    les rayons sont-ils des rayons ? le disque de frein est-il perforé ?
    la silhouette est-elle reconnaissable de profil ? la montrerais-tu à un pote ?<br>
    <b>Critère de reproductibilité :</b> si une seule de ces lignes exigeait un réglage à la main,
    le pipeline est en échec — pas la photo.`
}
document.title = 'pret:' + resultats.length
</script>
