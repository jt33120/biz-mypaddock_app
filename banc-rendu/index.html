<!doctype html>
<meta charset="utf-8">
<title>Banc d'essai — porte de rendu</title>
<style>
  :root { --nuit:#070B1A; --nuit2:#0C1228; --encre:#EDF3FF; --faible:#8FA3CE;
          --miami:#3DE0FF; --alerte:#FF5C5C; --mieux:#2BE88A; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--nuit); color:var(--encre); font:14px/1.4 ui-monospace,Menlo,monospace; padding:20px }
  h1 { font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--miami); font-weight:600 }
  .sous { color:var(--faible); margin:6px 0 18px; font-size:12px }
  .rangee { display:grid; grid-template-columns:250px 250px 250px 1fr; gap:12px; align-items:start;
            padding:14px 0; border-top:1px solid rgba(120,150,255,.18) }
  .vign { width:250px; height:250px; background:var(--nuit2); display:grid; place-items:center; overflow:hidden }
  .vign img, .vign canvas { max-width:100%; max-height:100%; display:block }
  .vign canvas { image-rendering:pixelated }
  #depot { margin-bottom:16px; color:var(--faible); font-size:12px }
  .etiq { color:var(--faible); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px }
  .fiche b { color:var(--encre) } .fiche div { margin:3px 0; color:var(--faible); font-size:12px }
  .pal { display:flex; margin-top:10px; height:22px; width:100%; max-width:340px }
  .pal i { flex:1 } .ok { color:var(--mieux) } .ko { color:var(--alerte) }
  #verdict { margin:22px 0 0; padding:14px; border:1px solid rgba(120,150,255,.18); font-size:12px; color:var(--faible) }
</style>
<h1>Banc d'essai — porte de rendu</h1>
<p class="sous">Réglages globaux et figés · aucun ajustement par photo · <span id="reg"></span></p>
<input type="file" id="depot" multiple accept="image/*">
<div id="journal" style="color:#FF5C5C;font-size:12px;white-space:pre-wrap"></div>
<div id="grille"></div>
<div id="verdict"></div>

<script type="module" src="./banc.js"></script>
