# yaml-language-server: $schema=https://unpkg.com/@powersync/cli-schemas@latest/json-schema/service-config.json

_type: cloud

name: mypaddock
# Le Postgres est à Paris (eu-west-3). Faire répliquer depuis les États-Unis
# ajouterait un aller-retour transatlantique à chaque écriture.
region: eu

replication:
  connections:
    - type: postgresql
      name: supabase-mypaddock

      # L'HÔTE EST LA CONNEXION DIRECTE, et ce n'est pas un choix : le bac à sable
      # (Supavisor) a été essayé et refusé par la validation du 19 août —
      # « Supavisor does not support logical replication. Connect directly to the
      # postgres instance. » La réplication logique ne passe pas par un
      # multiplexeur de sessions, donc il n'y a rien à arbitrer.
      #
      # Conséquence à connaître : cet hôte ne publie plus d'adresse IPv4, seulement
      # une IPv6. C'est le service PowerSync qui doit savoir en sortir.
      hostname: db.oghmwkiklwaptjfouprx.supabase.co
      port: 5432
      database: postgres

      # Un rôle DÉDIÉ, jamais `postgres`. Il a besoin de REPLICATION et de
      # BYPASSRLS — il lit pour tout le monde, donc RLS le gênerait — mais il
      # n'écrit rien : les droits d'écriture lui sont explicitement retirés.
      # AD-12 vaut aussi pour lui : ce n'est pas parce qu'un rôle est technique
      # qu'il a le droit de toucher la saison de quelqu'un.
      username: powersync_role
      password:
        secret: !env POWERSYNC_DATABASE_PASSWORD

      sslmode: verify-full

# ─── Qui a le droit de se synchroniser ─────────────────────────────────────
# On vérifie les jetons Supabase par leur JWKS public plutôt que par un secret
# partagé. Vérifié le 19 août : le projet signe en ES256 (clé asymétrique), donc
# aucun secret n'a besoin d'exister des deux côtés — et il n'y a rien à faire
# tourner le jour où la clé est renouvelée.
client_auth:
  jwks_uri: https://oghmwkiklwaptjfouprx.supabase.co/auth/v1/.well-known/jwks.json
  # Supabase émet ses jetons avec `aud: authenticated`.
  additional_audiences:
    - authenticated
  # Aucun jeton de développement en production : le seul moyen d'entrer est un
  # vrai compte.
  allow_temporary_tokens: false
