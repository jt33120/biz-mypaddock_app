    <!-- Remplacé au build par le plugin `titre-depuis-la-constante` (vite.config.ts),
         qui lit la même source que le manifeste. Ne pas écrire le nom ici. -->
    <title>chargement</title>
    <style>
      /* Le décor du chargement. Il est inline parce qu'une feuille externe est
         une requête de plus avant le premier pixel — et c'est exactement ce
         qu'on essaie d'éviter ici. */
      html, body { margin: 0; padding: 0; background: #070B1A; }
      #chargement {
        position: fixed; inset: 0; z-index: 9999;
        background: #070B1A; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        image-rendering: pixelated; user-select: none;
      }
      /* La scène est dessinée pour 390 × 844. On la met à l'échelle plutôt que
         de la refluer : un pixel art qui se réagence n'est plus le même dessin.
         `min` et non `max` — couvrir recadrerait la moto. */
      .ch-scene {
        position: relative; width: 390px; height: 844px; flex: none;
        transform: scale(min(100vw / 390, 100dvh / 844));
        transform-origin: center;
      }
      .ch-moto { position: absolute; left: 18px; top: 344px; width: 354px; height: 309px; }
      .ch-moto img, .ch-lisere {
        position: absolute; inset: 0; width: 354px; height: 309px;
        image-rendering: pixelated;
      }
      .ch-lisere {
        background-color: #3DE0FF;
        -webkit-mask-size: 354px 309px; mask-size: 354px 309px;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        animation: chLisere 3.2s linear infinite;
      }
      @keyframes chFloorA { from { background-position: 50% 0 } to { background-position: 50% 20px } }
      @keyframes chFloorB { from { background-position: 50% 0 } to { background-position: 50% 40px } }
      @keyframes chFloorC { from { background-position: 50% 0 } to { background-position: 50% 60px } }
      @keyframes chFloorD { from { background-position: 50% 0 } to { background-position: 50% 90px } }
      @keyframes chLight  { 0%, 25% { background-color: #3DE0FF } 25.01%, 100% { background-color: #070B1A } }
      @keyframes chLisere { 0%, 86% { background-color: #3DE0FF } 86.01%, 100% { background-color: #FF2E9A } }
      /* La sortie : une coupe douce, jamais un fondu long — l'application est
         prête, la faire attendre son propre décor serait absurde. */
      #chargement.ch-parti { opacity: 0; pointer-events: none; transition: opacity .18s linear; }
      @media (prefers-reduced-motion: reduce) {
        /* Rien ne bouge, et les trois feux restent ALLUMÉS : la scène doit
           rester composée, pas amputée. Consigne du handoff. */
        [data-om-anim="1"], .ch-lisere { animation: none !important; }
        [data-om-light="1"] { background-color: #3DE0FF !important; }
        #chargement.ch-parti { transition: none; }
      }
    </style>

      <!-- ═══════════════════════════════════════════════════════════════════
           L'ÉCRAN DE CHARGEMENT — et il vit ICI, pas dans React.

           ⚠ C'EST TOUT L'INTÉRÊT. Ce qui est long au démarrage n'est pas React :
           c'est le paquet (≈755 Ko), la feuille de style, et surtout le moteur
           SQLite qui s'ouvre dans un worker OPFS. Un écran de chargement monté
           par React arrive APRÈS tout ça — c'est-à-dire quand il n'y a plus rien
           à attendre. Peint dans le document, il est là au premier coup d'œil,
           avant qu'une seule ligne de JavaScript ne soit lue.

           Design remis par Julian le 25 août 2026 (handoff Claude Design,
           « arcade 16 bits »), reproduit au pixel : mêmes couleurs, mêmes
           positions, mêmes durées. Le sprite est passé du SVG inline de la
           maquette — 3 106 rectangles, 150 802 octets — à deux PNG indexés de
           118 × 103 : le corps, et le liseré en masque pour qu'il reste
           colorable. 2 713 octets au lieu de 150 802, et VÉRIFIÉ IDENTIQUE au
           pixel près (0 différence sur 8 816 pixels opaques). Les sources sont
           dans src/assets/chargement/.

           ⚠ AUCUN INDICATEUR DE PROGRESSION, et c'est une contrainte de produit,
           pas un oubli : ni barre, ni pourcentage, ni rond qui tourne, ni le mot
           « chargement ». Ce produit ne compte rien et ne presse personne.
           ═══════════════════════════════════════════════════════════════════ -->
