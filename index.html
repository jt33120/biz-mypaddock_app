<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : indispensable pour que env(safe-area-inset-*) existe -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- QO-1 ouverte : rien de public sous le nom de code. À retirer quand le
         nom est tranché et les préconditions de QO-11 levées. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0c0c0c" />
    <!-- Déclarées explicitement : sans elles le navigateur réclame /favicon.ico,
         qui n'existe pas, et l'onglet arbore une page blanche. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Remplacé au build par le plugin `titre-depuis-la-constante` (vite.config.ts),
         qui lit la même source que le manifeste. Ne pas écrire le nom ici. -->
    <title>Ouverture du paddock</title>
    <link rel="preload" as="image" href="/images/night-session.webp" />
    <style>
      /* Bootstrap tokens keep the first paint independent of React and SQLite. */
      :root {
        --ch-ink: #0c0c0c;
        --ch-paper: #f5f5f5;
        --ch-muted: #bcbcbc;
        --ch-pink: #f5f5f5;
        --ch-mint: #ededed;
        --ch-rule: #343434;
        --ch-shade: color-mix(in srgb, #0c0c0c 24%, transparent);
        --ch-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        --ch-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
        --ch-space-1: 0.5rem;
        --ch-space-2: 0.75rem;
        --ch-space-3: 1.5rem;
        --ch-space-4: 2rem;
        --ch-space-5: 4rem;
        --ch-small: .75rem;
        --ch-copy: 1rem;
        --ch-brand: clamp(2.25rem, 8vw, 4.25rem);
        --ch-canvas: 100rem;
        --ch-exit: 180ms;
      }
      html, body { margin: 0; padding: 0; background: var(--ch-ink); }
      #chargement {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; color: var(--ch-paper); background: var(--ch-ink);
        font-family: var(--ch-body); isolation: isolate;
      }
      .ch-art, .ch-scrim { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ch-art {
        object-fit: cover; object-position: 58% center; z-index: -3;
        filter: grayscale(1); animation: ch-cruise 7s linear infinite;
      }
      .ch-bike {
        position: absolute; z-index: -1; left: 7%; top: 20%; width: 86%; height: 48%;
        object-fit: contain; border-radius: var(--ch-space-2);
        filter: drop-shadow(0 1rem 2rem var(--ch-ink))
          drop-shadow(0 0 2.5rem color-mix(in srgb, var(--violet-electrique) 12%, transparent));
        animation: ch-ride 3.6s cubic-bezier(.2, .6, .4, 1) infinite;
      }
      .ch-bike[hidden] { display: none; }
      .ch-personal .ch-art { opacity: .2; filter: grayscale(1) blur(4px); }
      .ch-speed {
        position: absolute; inset: 0; z-index: -1; pointer-events: none;
        overflow: hidden; opacity: .32;
      }
      .ch-speed::before, .ch-speed::after {
        content: ""; position: absolute; left: -35%; top: 63%; width: 28%; height: 1px;
        background: linear-gradient(90deg, transparent, var(--bleu-electrique), var(--violet-electrique));
        animation: ch-streak 1.8s linear infinite;
      }
      .ch-speed::after { top: 68%; width: 42%; animation-delay: -.9s; animation-duration: 2.4s; }
      .ch-scrim {
        z-index: -2;
        background:
          radial-gradient(ellipse at 12% 42%, color-mix(in srgb, var(--bleu-electrique) 14%, transparent), transparent 58%),
          radial-gradient(ellipse at 95% 62%, color-mix(in srgb, var(--violet-electrique) 16%, transparent), transparent 56%),
          linear-gradient(180deg, var(--ch-ink) 0%, transparent 30%, var(--ch-shade) 52%, var(--ch-ink) 100%);
      }
      .ch-scene {
        box-sizing: border-box; width: 100%; max-width: var(--ch-canvas); min-height: 100%; margin: auto;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: max(var(--ch-space-4), env(safe-area-inset-top)) max(var(--ch-space-3), env(safe-area-inset-right)) max(var(--ch-space-4), env(safe-area-inset-bottom)) max(var(--ch-space-3), env(safe-area-inset-left));
      }
      .ch-topline {
        display: flex; justify-content: space-between; gap: var(--ch-space-3);
        font-size: var(--ch-small); font-weight: 500; line-height: 1.5;
        letter-spacing: .16em; text-transform: uppercase;
      }
      .ch-edition { color: var(--bleu-electrique); }
      .ch-footer { display: grid; gap: var(--ch-space-4); }
      .ch-brand { margin: 0; max-width: 100%; font: 700 var(--ch-brand)/1.06 var(--ch-display); letter-spacing: -.045em; }
      .ch-tagline { margin: var(--ch-space-3) 0 0; color: var(--ch-muted); font-size: var(--ch-copy); }
      .ch-status { max-width: 22rem; }
      .ch-status-label { margin: 0 0 var(--ch-space-2); font-size: var(--ch-copy); font-weight: 500; }
      .ch-rail {
        height: .1875rem; overflow: hidden;
        background: linear-gradient(90deg,
          color-mix(in srgb, var(--bleu-electrique) 18%, var(--ch-rule)),
          color-mix(in srgb, var(--violet-electrique) 18%, var(--ch-rule)));
        box-shadow: 0 0 .75rem color-mix(in srgb, var(--violet-electrique) 14%, transparent);
      }
      .ch-rail::after {
        content: ""; display: block; width: 32%; height: 100%;
        background: linear-gradient(90deg, var(--gradient-debut), var(--gradient-fin));
        animation: ch-pass 1.6s ease-in-out infinite;
      }
      .ch-noscript { margin: var(--ch-space-2) 0 0; max-width: 32rem; color: var(--ch-paper); font-size: var(--ch-copy); }
      @keyframes ch-pass { from { transform: translateX(-110%); } to { transform: translateX(420%); } }
      @keyframes ch-cruise {
        from { transform: translateX(-4%) scale(1.12); }
        to { transform: translateX(4%) scale(1.12); }
      }
      @keyframes ch-ride {
        0% { transform: translateX(-9%); opacity: .72; }
        18%, 72% { opacity: 1; }
        100% { transform: translateX(9%); opacity: .72; }
      }
      @keyframes ch-streak { to { transform: translateX(520%); } }
      #chargement.ch-parti { opacity: 0; pointer-events: none; transition: opacity var(--ch-exit) ease-out; }
      @media (min-width: 64rem) {
        .ch-scene { padding: var(--ch-space-5); }
        .ch-footer { grid-template-columns: minmax(0, 1fr) minmax(14rem, 22rem); align-items: end; gap: var(--ch-space-5); }
        .ch-status { padding-bottom: var(--ch-space-1); }
        .ch-noscript { grid-column: 1 / -1; }
        .ch-bike { left: 20%; top: 15%; width: 60%; height: 60%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ch-rail::after { animation: none; transform: none; width: 100%; }
        .ch-art, .ch-bike, .ch-speed::before, .ch-speed::after { animation: none; transform: none; }
        .ch-speed { display: none; }
        #chargement.ch-parti { transition: none; }
      }
    </style>
  </head>
  <body>
    <!-- Visible before the application bundle and local database are ready. -->
    <div id="chargement">
      <img class="ch-art" src="/images/night-session.webp" alt="" fetchpriority="high" />
      <div class="ch-scrim" aria-hidden="true"></div>
      <img id="ch-bike" class="ch-bike" alt="" hidden />
      <div class="ch-speed" aria-hidden="true"></div>
      <div class="ch-scene">
        <div class="ch-topline" aria-hidden="true">
          <span class="ch-edition">En piste</span>
          <span>Carnet de roulage</span>
        </div>
        <div class="ch-footer">
          <div>
            <h1 class="ch-brand">__PRODUCT_NAME__</h1>
            <p class="ch-tagline">Ta moto. Tes journées. Ton histoire.</p>
          </div>
          <div class="ch-status" role="status" aria-live="polite" aria-atomic="true">
            <p class="ch-status-label">Ouverture du paddock</p>
            <div class="ch-rail" aria-hidden="true"></div>
          </div>
          <noscript><p class="ch-noscript">Active JavaScript dans ton navigateur pour ouvrir ton carnet.</p></noscript>
        </div>
      </div>
    </div>
    <!-- Classic and deliberately tiny: no React dependency, no inline-script CSP exception. -->
    <script src="/splash-cache.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
