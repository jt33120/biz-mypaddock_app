<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : indispensable pour que env(safe-area-inset-*) existe -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <!-- QO-1 ouverte : rien de public sous le nom de code. À retirer quand le
         nom est tranché et les préconditions de QO-11 levées. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070B14" />
    <!-- Déclarées explicitement : sans elles le navigateur réclame /favicon.ico,
         qui n'existe pas, et l'onglet arbore une page blanche. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Remplacé au build par le plugin `titre-depuis-la-constante` (vite.config.ts),
         qui lit la même source que le manifeste. Ne pas écrire le nom ici. -->
    <title>chargement</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
